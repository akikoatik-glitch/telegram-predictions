name: Football predictions poster

on:
  schedule:
    # Daily fixtures refresh (06:00 UTC)
    - cron: '0 6 * * *'
    # Pre-match check every 10 min — posts ~10-15 min before kickoff
    - cron: '*/10 * * * *'
    # Results grading every hour
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual run mode'
        required: true
        default: 'post'
        type: choice
        options: [post, fetch, results]

permissions:
  contents: write

jobs:
  fetch:
    if: github.event.schedule == '0 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'fetch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node fetch-fixtures.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SEASON: '2026-27'
      - name: Commit fresh cache
        run: |
          git config user.name "predictions-bot"
          git config user.email "predictions-bot@users.noreply.github.com"
          git add data/cache.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "fixtures refresh $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "push race, retry $i"; sleep 5
          done

  post:
    if: github.event.schedule == '*/10 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'post')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admin pause guard
        run: |
          if [ "${{ vars.PAUSED }}" = "true" ]; then echo "PAUSED by admin - skipping"; exit 0; fi
      - run: node post-due.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SEASON: '2026-27'
          LANG: 'ar'
          PREDICTION_MINUTES_BEFORE_KICKOFF: '15'
          MIN_CONFIDENCE: '75'
          MAX_POSTS_PER_DAY: '15'
      - name: Commit predictions DB
        run: |
          git config user.name "predictions-bot"
          git config user.email "predictions-bot@users.noreply.github.com"
          git add data/predictions.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "predictions $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "push race, retry $i"; sleep 5
          done

  results:
    if: github.event.schedule == '35 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'results')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node check-results.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SEASON: '2026-27'
          LANG: 'ar'
      - run: node stats.js --md
      - name: Commit results + stats
        run: |
          git config user.name "predictions-bot"
          git config user.email "predictions-bot@users.noreply.github.com"
          git add data/predictions.json data/stats.json STATS.md
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "results $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "push race, retry $i"; sleep 5
          done
